[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "Intelligent HTTP/HTTPS Intercepting Proxy & Security Testing Workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mitmproxy>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "aiosqlite>=0.19.0",
    "cryptography>=40.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "sse-starlette>=1.6.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
flowforge = "flowforge.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowforge*"]
